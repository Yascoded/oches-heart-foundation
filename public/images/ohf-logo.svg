<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Oche's Heart Foundation (OHF) Logo">
  <defs>
    <linearGradient id="ohf-navy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2442" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <linearGradient id="ohf-heart-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="55%" stop-color="#C51E2E" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Rounded Badge -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#ohf-navy-bg)" />
  <rect x="6" y="6" width="108" height="108" rx="24" fill="none" stroke="url(#ohf-heart-accent)" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Subtle Heart Icon -->
  <path
    d="M60 55 C60 55 39 42 39 30 C39 23 44.5 18 51 18 C55.2 18 58.6 20.4 60 23.5 C61.4 20.4 64.8 18 69 18 C75.5 18 81 23 81 30 C81 42 60 55 60 55 Z"
    fill="url(#ohf-heart-accent)"
  />

  <!-- Bold Geometric OHF Typography -->
  <g fill="#FFFFFF">
    <!-- O -->
    <rect x="23.5" y="69.5" width="18" height="23" rx="9" fill="none" stroke="#FFFFFF" stroke-width="6.5" />

    <!-- H -->
    <rect x="50.5" y="66.25" width="6.5" height="29.5" rx="1.5" />
    <rect x="66" y="66.25" width="6.5" height="29.5" rx="1.5" />
    <rect x="50.5" y="77.75" width="22" height="6.5" />

    <!-- F -->
    <rect x="79.5" y="66.25" width="6.5" height="29.5" rx="1.5" />
    <rect x="79.5" y="66.25" width="20.5" height="6.5" rx="1.5" />
    <rect x="79.5" y="77.75" width="15.5" height="6.5" rx="1.5" />
  </g>

  <!-- Subtle Warm Accent Underline -->
  <rect x="20" y="103" width="80" height="3" rx="1.5" fill="url(#ohf-heart-accent)" opacity="0.9" />
</svg>
