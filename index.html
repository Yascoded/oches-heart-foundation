<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/ohf-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oche's Heart Foundation | Touching Lives. Empowering Citizens. Transforming Society.</title>
    <meta name="description" content="Oche's Heart Foundation is dedicated to touching lives, empowering citizens, and transforming society through humanitarian service, civic and electoral education, youth leadership, and community development." />
    <!-- Google Fonts: Poppins & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ohf-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FFFDF9] dark:bg-[#0A192F] text-[#1E293B] dark:text-[#CBD5E1] font-sans antialiased selection:bg-[#C51E2E] dark:selection:bg-[#E84C3D] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
